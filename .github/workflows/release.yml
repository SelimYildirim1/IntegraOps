name: IntegraOps release images

# A release is a git tag vX.Y.Z. The same commit produces api, worker and panel images tagged
# with the version and the commit SHA, so a running system can be traced back to its source.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (for example v1.0.0-rc.1); must exist as a git tag"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/integraops

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: .
            file: deploy/docker/Dockerfile
            target: api
          - name: worker
            context: .
            file: deploy/docker/Dockerfile
            target: worker
          - name: panel
            context: frontend
            file: frontend/Dockerfile
            target: ""
          - name: agent
            context: .
            file: deploy/docker/Dockerfile.agent
            target: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
      - name: Resolve version
        id: v
        run: |
          version="${{ inputs.version || github.ref_name }}"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Invalid version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "registry=$(echo "$REGISTRY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
            APP_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.v.outputs.registry }}/${{ matrix.name }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.registry }}/${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  notes:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Release summary
        run: |
          {
            echo "### ${{ inputs.version || github.ref_name }}"
            echo "Commit: \`${{ github.sha }}\`"
            echo "Deploy on the live host: \`scripts/live/deploy.sh ${{ inputs.version || github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
