# Local monitoring stack. Use together with the main file:
#   docker compose -f docker-compose.yml -f compose.monitoring.yml up -d
# Prometheus :9090 · Alertmanager :9093 · Grafana :3001 · Jaeger :16686 (all on 127.0.0.1)
services:
  api:
    environment:
      Telemetry__MetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
      Telemetry__TracesEndpoint: http://jaeger:4318/v1/traces
      Telemetry__Environment: local
  worker:
    environment:
      Telemetry__MetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
      Telemetry__TracesEndpoint: http://jaeger:4318/v1/traces
      Telemetry__Environment: local

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-otlp-receiver
      - --web.enable-lifecycle
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run python3 scripts/prepare_v1.py}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/integraops-health.json
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: [--path.rootfs=/host, --collector.textfile.directory=/textfile]
    volumes:
      - /:/host:ro,rslave
      # backup scripts write integraops_backup_*.prom here
      - ./.local/metrics:/textfile:ro

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    restart: unless-stopped
    ports: ["127.0.0.1:16686:16686"]

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
