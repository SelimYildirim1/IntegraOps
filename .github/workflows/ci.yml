name: IntegraOps checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V1_OWNER_EMAIL: ci-owner@local.test
      V1_OWNER_NAME: CI Owner
      # A disposable account in this job's isolated local database, never a deployment credential.
      V1_OWNER_PASSWORD: ci-only-test-password-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build IntegraOps.slnx -c Release
      - name: Unit tests
        run: dotnet test IntegraOps.slnx -c Release --no-build
      - name: Verification client contract tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Local configuration
        run: |
          python3 scripts/init_local.py
          python3 scripts/prepare_v1.py
      - name: Start actual services
        run: docker compose up --build -d
      - name: Verify the event pipeline
        run: python3 scripts/verify_api.py
      - name: Configure V1 and start the source sample
        run: |
          python3 scripts/setup_v1.py
          docker compose --profile demo up --build -d source
      - name: Verify V1 modules
        run: python3 scripts/verify_v1.py --load 50
      - name: Verify pipeline and delays after owner setup
        run: |
          python3 scripts/verify_api.py --session
          python3 scripts/verify_delays.py --session
      - name: Verify V1.1 operation features
        run: python3 scripts/verify_v1_1.py
      - name: Verify V1.2 flow versioning
        run: python3 scripts/verify_v1_2.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: agent/go.sum
      - name: Verify transfer agent
        run: python3 scripts/verify_agent.py
      - name: Verify reconciliation service
        run: |
          python3 -m venv reconciler/.venv && reconciler/.venv/bin/pip install --quiet pg8000
          python3 scripts/verify_reconciler.py
          python3 scripts/verify_reports.py
          python3 scripts/verify_v2_flows.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify connections and SDKs
        run: |
          (cd sdk/typescript && npm ci && npm run build)
          python3 scripts/verify_connections.py
      - name: Verify enterprise features
        run: python3 scripts/verify_enterprise.py
      - name: Start monitoring stack
        run: docker compose -f docker-compose.yml -f compose.monitoring.yml up -d
      - name: Verify monitoring
        run: python3 scripts/verify_monitoring.py
      - name: Validate live configuration
        run: |
          cp .env.live.example .env.live.ci
          sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=ci/' .env.live.ci
          docker compose -f compose.live.yml --env-file .env.live.ci config --quiet
          bash -n scripts/live/*.sh
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150 api worker migrate
      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.yml -f compose.monitoring.yml --profile demo down

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: agent/go.sum
      - run: gofmt -l . && test -z "$(gofmt -l .)"
        working-directory: agent
      - run: go vet ./...
        working-directory: agent
      - run: go test ./...
        working-directory: agent

  reconciler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
        working-directory: reconciler

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run build && npm test
        working-directory: sdk/typescript
      - run: python3 -m unittest test_integraops_sender -v
        working-directory: sdk/python
