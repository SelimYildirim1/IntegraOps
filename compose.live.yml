# Live deployment. Runs published images only, so a release is exactly the images of one tag.
# Operated through scripts/live/*.sh, which pass --env-file .env.live and the project name.
#   IMAGE_REGISTRY/IMAGE_TAG select the release; see docs/canli-ortam.md.
name: ${COMPOSE_PROJECT_NAME:-integraops-live}

x-telemetry: &telemetry
  Telemetry__MetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
  Telemetry__Environment: ${DEPLOYMENT_ENVIRONMENT:-production}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: integraops
      POSTGRES_DB: integraops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integraops -d integraops"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: integraops
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Required}
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/rabbitmq/.erlang.cookie && rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 24
  migrate:
    image: ${IMAGE_REGISTRY:?Required}/api:${IMAGE_TAG:?Required}
    command: ["--migrate"]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=integraops;Username=integraops;Password=${POSTGRES_PASSWORD};Timeout=5;Command Timeout=60"
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
  api:
    image: ${IMAGE_REGISTRY:?Required}/api:${IMAGE_TAG:?Required}
    restart: unless-stopped
    deploy: { replicas: "${API_REPLICAS:-1}" }
    environment:
      <<: *telemetry
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Database=integraops;Username=integraops;Password=${POSTGRES_PASSWORD};Timeout=5;Command Timeout=15"
      Bootstrap__Key: ${BOOTSTRAP_KEY:?Required}
      Notifications__WebhookOrigins: ${WEBHOOK_ORIGINS:-}
      Panel__BaseUrl: https://${PANEL_HOST}
      Api__PublicUrl: https://${API_HOST}
      SystemAdmin__Emails: ${SYSTEM_ADMIN_EMAILS:-}
      Signup__Enabled: ${SIGNUP_ENABLED:-false}
      Exports__Path: /var/lib/integraops/exports
      Ai__Provider: ${AI_PROVIDER:-none}
      Ai__Model: ${AI_MODEL:-}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__DailyLimitPerProject: ${AI_DAILY_LIMIT:-200}
    volumes: ["protection_keys:/var/lib/integraops/keys", "exports_data:/var/lib/integraops/exports"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    image: ${IMAGE_REGISTRY:?Required}/worker:${IMAGE_TAG:?Required}
    restart: unless-stopped
    deploy: { replicas: "${WORKER_REPLICAS:-1}" }
    environment:
      <<: *telemetry
      ConnectionStrings__Postgres: "Host=postgres;Database=integraops;Username=integraops;Password=${POSTGRES_PASSWORD};Timeout=5;Command Timeout=15"
      RabbitMQ__Uri: "amqp://integraops:${RABBITMQ_PASSWORD}@rabbitmq:5672/"
      Notifications__WebhookOrigins: ${WEBHOOK_ORIGINS:-}
      Notifications__RetryBaseSeconds: 30
      Smtp__Host: ${SMTP_HOST:?Required}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__StartTls: ${SMTP_STARTTLS:-true}
      Smtp__From: ${SMTP_FROM:?Required}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
    volumes: ["protection_keys:/var/lib/integraops/keys"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
  panel:
    image: ${IMAGE_REGISTRY:?Required}/panel:${IMAGE_TAG:?Required}
    restart: unless-stopped
    environment:
      INTEGRAOPS_API_URL: http://api:8080
      PANEL_COOKIE_SECURE: "true"
    depends_on: [api]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PANEL_HOST: ${PANEL_HOST:?Required}
      API_HOST: ${API_HOST:?Required}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [panel, api]

  # Monitoring: not published to the internet. Reach Grafana through an SSH tunnel:
  #   ssh -L 3001:127.0.0.1:3001 server
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-otlp-receiver
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    volumes:
      # Rendered from deploy/monitoring/alertmanager.live.yml.template by scripts/live/deploy.sh.
      - ${LIVE_STATE_DIR:?Required}/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/integraops-health.json
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: [--path.rootfs=/host, --collector.textfile.directory=/textfile]
    volumes:
      - /:/host:ro,rslave
      - ${LIVE_STATE_DIR:?Required}/metrics:/textfile:ro

volumes:
  postgres_data:
  rabbitmq_data:
  protection_keys:
  exports_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
  grafana_data:
